name: CI
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:
jobs:
  test:
    name: Node.js ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        # os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - run: git config --global user.name "Github Actions"
      - run: git config --global user.email "actions@users.noreply.github.com"
      - run: npm ci
      - run: npx -y playwright install --with-deps chromium
      - run: npm run prepublishOnly
      - run: npm run test
      - run: npm run test:engines
  native-compatibility:
    name: Native compatibility (current)
    permissions:
      contents: read
    uses: kmalakoff/react-native-outside/.github/workflows/native.yml@44bd66ef48915a0abf3250072657d2e0a4ef2dab
    with:
      profile: current
      candidate_package: react-native-contains
      candidate_repository: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
      candidate_sha: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
      fixture_repository: kmalakoff/react-native-outside
      fixture_sha: 44bd66ef48915a0abf3250072657d2e0a4ef2dab
